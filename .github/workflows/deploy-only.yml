name: Deploy only (no data refresh)
# For cosmetic changes to index-live-auto.html: publishes the file exactly as
# committed, with the data that was baked into it by the last full refresh.
# Takes about a minute instead of the 15-35 minute full refresh. Trigger:
#   POST /repos/yicongngai/jnd-dashboard/actions/workflows/deploy-only.yml/dispatches
on:
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bake the committed data into the page (no fetching), then stage
        run: |
          # launches.json is a build input that is not tracked (tidy-up, 4 Sep 2026); rebuild it
          # from the tracked scrape, or fall back to the auto board, before baking.
          # (6 Sep 2026: rebuilding from the tracked raw scrape shipped a June board and turned the OS card amber; scrape fresh instead)
          [ -f market-tab/launches.json ] || ( cd market-tab && python3 era_scrape.py ) || ( cd market-tab && python3 build_board.py ) || cp market-tab/launches.auto.json market-tab/launches.json
          SKIP_FETCH=1 python3 inject_data_all.py
          grep -q 'id="jnd-map"' index-live-auto.html || { echo "no map data baked — abort"; exit 1; }
          mkdir -p publish
          cp index-live-auto.html publish/index.html
          cp playbook.pdf publish/playbook.pdf
          cp theme-os-toolkit.css publish/theme-os-toolkit.css
          [ -f headlines.json ] && cp headlines.json publish/headlines.json || true
          # keep parity with inject_data_all.py, which stages the Decoupling Toolkit file too
          [ -f decoupling.html ] && cp decoupling.html publish/decoupling.html || true
          # launch presentation pages: built page + referenced assets only (6 Sep 2026)
          for d in launch/*/; do [ -f "$d/index.html" ] || continue; mkdir -p "publish/$d"; cp "$d/index.html" "publish/$d/"; cp -r "$d/assets" "publish/$d/"; done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish
      - id: deploy
        uses: actions/deploy-pages@v4
